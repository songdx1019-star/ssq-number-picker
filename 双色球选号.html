<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双色球 · 随机排除选号</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#243047;font:16px 'Microsoft YaHei',sans-serif}main{max-width:1000px;margin:40px auto;padding:32px;background:white;border-radius:22px;box-shadow:0 12px 50px #24304712}h1{margin:0 0 10px;font-size:30px}p{color:#647087;line-height:1.7}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin:24px 0}label{display:flex;flex-direction:column;gap:8px;font-size:14px}input,select,button{font:inherit;padding:12px;border:1px solid #d6deea;border-radius:9px}input{width:150px}button{cursor:pointer;background:#2459d3;color:white;border:0}button.secondary{background:#eaf0fc;color:#2459d3}button:disabled{opacity:.45;cursor:default}.stats{background:#f5f7fc;padding:18px;border-radius:12px;line-height:1.9}progress{width:100%;height:14px;margin:14px 0}.ticket{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #edf0f5}.ball{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;background:#ed4759;color:white;font-weight:bold}.blue{background:#3474de}.index{min-width:60px;color:#7a8699}#results{max-height:440px;overflow:auto}pre{height:150px;overflow:auto;background:#182336;color:#b7c7df;padding:15px;border-radius:10px;font:13px Consolas,monospace;white-space:pre-wrap}small{color:#79859a}h2{font-size:19px} @media(max-width:600px){main{margin:12px;padding:20px}.ball{width:30px;height:30px}.ticket{gap:5px}.index{min-width:40px}}
</style>
<main><h1>双色球 · 随机排除选号</h1><p style="color:#ad4b20;background:#fff4e8;padding:12px 16px;border-radius:10px;font-weight:bold">仅供娱乐，不构成购买建议。</p><p>从 01–33 中选 6 个红球，从 01–16 中选 1 个蓝球。全部组合 n = <b>17,721,088</b>。设置今天买 x 注，留下的号码就是选号结果。</p>
<div class="controls"><label>今天买几注（x）<input id="count" type="number" min="1" max="17721088" value="5"></label><label>选号方式<select id="mode"><option value="exact">完整排除：随机生成并去重</option><option value="fast">快速选号：等概率抽取剩余号码</option></select></label><button id="start">开始选号</button><button id="pause" class="secondary" disabled>暂停</button><button id="cancel" class="secondary" disabled>停止</button></div>
<div class="stats" id="status">准备就绪。完整模式可能需要较长时间，可暂停后继续。</div><progress id="progress" value="0" max="17721088"></progress>
<small>完整模式每次随机生成一注，已出现的组合不再计入排除数，剩余恰好 x 注时停止。日志只显示近期样本，所有生成号码均参与去重。关闭页面会丢失进度。</small>
<h2>随机生成记录</h2><pre id="log">尚未开始</pre><h2>最终留下的号码</h2><div id="results"></div><div class="controls"><button id="copy" class="secondary" disabled>复制全部结果</button><button id="save" class="secondary" disabled>保存 TXT</button></div><p><small>快速模式与完整排除模式的最终结果具有相同的概率分布，但不会实际生成排除记录。随机选号不会提高单注中奖概率。</small></p></main>
<script>
const N=17721088,$=id=>document.getElementById(id);let worker=null,tickets=[],paused=false;
function choose(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)}
function decode(id){let rank=Math.floor(id/16),red=[],last=0;for(let k=6;k>0;k--){for(let v=last+1;v<=33;v++){let c=choose(33-v,k-1);if(rank<c){red.push(v);last=v;break}rank-=c}}return {red,blue:id%16+1}}
const fmt=id=>{let t=decode(id);return t.red.map(v=>String(v).padStart(2,'0')).join(' ')+' + '+String(t.blue).padStart(2,'0')};
const source=`const N=17721088;let x,mode,bits,unique=0,draws=0,running=false,started,elapsed=0;const buf=new Uint32Array(16384);let at=buf.length;function random(n){let lim=Math.floor(4294967296/n)*n,v;do{if(at===buf.length){crypto.getRandomValues(buf);at=0}v=buf[at++]}while(v>=lim);return v%n}function report(sample=[]){postMessage({type:'progress',unique,draws,ms:elapsed+performance.now()-started,sample})}onmessage=e=>{let d=e.data;if(d.type==='start'){x=d.x;mode=d.mode;started=performance.now();running=true;if(mode==='fast'){let kept=new Set();for(let j=N-x;j<N;j++){let t=random(j+1);kept.add(kept.has(t)?j:t)}postMessage({type:'done',ids:[...kept],ms:performance.now()-started});return}bits=new Uint8Array(Math.ceil(N/8));step()}else if(d.type==='pause'){running=false;elapsed+=performance.now()-started}else if(d.type==='resume'){started=performance.now();running=true;step()}};function step(){if(!running)return;let end=performance.now()+80,sample=[];while(unique<N-x && performance.now()<end){let id=random(N),b=id>>3,m=1<<(id&7),fresh=!(bits[b]&m);draws++;if(fresh){bits[b]|=m;unique++}if(sample.length<5)sample.push({id,fresh})}report(sample);if(unique===N-x){let ids=[];for(let id=0;id<N;id++)if(!(bits[id>>3]&(1<<(id&7))))ids.push(id);postMessage({type:'done',ids,ms:elapsed+performance.now()-started});running=false}else setTimeout(step,0)}`;
function busy(b){$('start').disabled=b;$('count').disabled=b;$('mode').disabled=b;$('pause').disabled=!b||$('mode').value==='fast';$('cancel').disabled=!b}
$('start').onclick=()=>{const x=Number($('count').value);if(!Number.isInteger(x)||x<1||x>N){alert('请输入 1 到 17,721,088 之间的整数。');return}if(x>10000&&!confirm('所选注数较多，生成和导出会占用较多内存。继续吗？'))return;tickets=[];$('results').replaceChildren();$('copy').disabled=$('save').disabled=true;$('log').textContent='';$('progress').value=0;paused=false;$('pause').textContent='暂停';busy(true);$('status').textContent='正在选号…';const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);worker.onerror=e=>{ $('status').textContent='运行失败：'+e.message;worker.terminate();worker=null;busy(false)};worker.onmessage=e=>{let d=e.data;if(d.type==='progress'){$('progress').value=d.unique;$('status').textContent='生成次数：'+d.draws.toLocaleString()+' ｜已排除：'+d.unique.toLocaleString()+' ｜尚未出现：'+(N-d.unique).toLocaleString()+' ｜用时：'+(d.ms/1000).toFixed(1)+' 秒';if(d.sample.length){let lines=d.sample.map(s=>fmt(s.id)+(s.fresh?'  已排除':'  重复，不计')).join('\n');$('log').textContent=($('log').textContent+'\n'+lines).split('\n').slice(-60).join('\n');$('log').scrollTop=$('log').scrollHeight}}else{tickets=d.ids;$('progress').value=N-x;$('status').textContent='选号完成：留下 '+x.toLocaleString()+' 注 ｜用时 '+(d.ms/1000).toFixed(2)+' 秒';$('log').textContent=$('mode').value==='fast'?'快速模式：直接等概率选取剩余组合，无排除记录。':$('log').textContent;let fragment=document.createDocumentFragment();tickets.slice(0,1000).forEach((id,i)=>{let t=decode(id),row=document.createElement('div');row.className='ticket';row.innerHTML='<span class="index">'+(i+1)+'</span>'+t.red.map(v=>'<span class="ball">'+String(v).padStart(2,'0')+'</span>').join('')+'<span class="ball blue">'+String(t.blue).padStart(2,'0')+'</span>';fragment.appendChild(row)});$('results').appendChild(fragment);if(x>1000)$('results').append('界面只显示前 1,000 注，保存 TXT 可取得全部结果。');$('copy').disabled=$('save').disabled=false;worker.terminate();worker=null;busy(false)}};worker.postMessage({type:'start',x,mode:$('mode').value})};
$('pause').onclick=()=>{paused=!paused;worker.postMessage({type:paused?'pause':'resume'});$('pause').textContent=paused?'继续':'暂停';if(paused)$('status').textContent+=' ｜已暂停'};
$('cancel').onclick=()=>{if(worker)worker.terminate();worker=null;busy(false);$('status').textContent='已停止。尚未得到最终剩余号码，可重新开始。'};
function resultText(){return '双色球随机选号\r\n仅供娱乐，不构成购买建议。\r\n'+new Date().toLocaleString('zh-CN')+'\r\n共 '+tickets.length+' 注\r\n\r\n'+tickets.map((id,i)=>(i+1)+'. '+fmt(id)).join('\r\n')}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(resultText());$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制全部结果',1500)}catch{alert('浏览器未允许复制，请使用保存 TXT。')}};
$('save').onclick=()=>{let url=URL.createObjectURL(new Blob(['\ufeff'+resultText()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='双色球选号-'+new Date().toLocaleDateString('sv-SE')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
